[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netgamut"
dynamic = ["version"]
description = "Browse, download and cache network datasets, starting with the Stanford SNAP collection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The MapEquation team", email = "daniel.edler@umu.se" }]
keywords = [
  "networks",
  "graphs",
  "datasets",
  "snap",
  "network-science",
  "complex-networks",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["platformdirs>=4.0", "numpy>=1.24"]

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
# Only needed to materialise a PyG dataset the first time; a materialised one is
# plain CSV and reads without torch.
pyg = ["torch-geometric>=2.4", "networkx>=3.0"]
infomap = ["infomap>=2.8"]
# Only for `netgamut export-networks`, which writes the web mirror as Parquet.
export = ["pyarrow>=18"]
generate = ["networkx>=3.0", "infomap>=2.8", "scipy>=1.10", "numba>=0.59"]
all = ["networkx>=3.0", "infomap>=2.8", "scipy>=1.10", "numba>=0.59"]

[project.urls]
Homepage = "https://www.mapequation.org"
Repository = "https://github.com/mapequation/netgamut"
Issues = "https://github.com/mapequation/netgamut/issues"

[project.scripts]
netgamut = "netgamut.__main__:main"

[dependency-groups]
# pyyaml is here rather than in the extras because only the AHORN catalog
# *build* needs it -- reading the vendored snapshot and downloading datasets
# need nothing. See scripts/regenerate_ahorn_catalog.py.
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "pyyaml>=6", "types-PyYAML>=6", "pyarrow>=18"]
# The documentation site; .github/workflows/pages.yml builds it.
docs = ["sphinx>=8.2", "furo>=2025.12.19", "myst-nb>=1.4", "sphinx-copybutton>=0.5.2"]

[tool.hatch.version]
path = "src/netgamut/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/netgamut"]

[tool.hatch.build.targets.sdist]
include = ["src/netgamut", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test requires internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The sampler internals are the reference implementation of the generative map
# equation; their style is kept close to the derivations they implement.
[tool.ruff.lint.per-file-ignores]
"src/netgamut/generate/_flowgen.py" = ["B905", "E501", "E702", "SIM300"]
"src/netgamut/generate/_params.py" = ["B905", "B007"]

# The same goes for their hand-aligned comments, and for the README's examples.
[tool.ruff.format]
exclude = ["src/netgamut/generate/_flowgen.py", "*.md"]

[tool.mypy]
python_version = "3.11"
packages = ["netgamut"]
strict = true

# Optional extras used only behind lazy imports in Network.to_*() and
# netgamut.generate. numpy's stubs use 3.12+ syntax that python_version 3.11
# rejects, so its stubs are skipped, not followed.
[[tool.mypy.overrides]]
module = ["networkx.*", "infomap.*", "scipy.*", "numpy.*", "numba.*", "torch_geometric.*", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

# The sampler internals are the reference implementation of the generative map
# equation; kept untyped so they read like the maths they implement.
[[tool.mypy.overrides]]
module = [
  "netgamut.generate._flowgen",
  "netgamut.generate._higher_order",
  "netgamut.generate._params",
  "netgamut.generate._partdist",
]
ignore_errors = true
disallow_untyped_defs = false
