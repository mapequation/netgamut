[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapequation-networks"
dynamic = ["version"]
description = "Browse, download and cache network datasets, starting with the Stanford SNAP collection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The MapEquation team", email = "daniel.edler@umu.se" }]
keywords = [
  "networks",
  "graphs",
  "datasets",
  "snap",
  "network-science",
  "complex-networks",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["platformdirs>=4.0"]

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
infomap = ["infomap>=2.8"]
all = ["networkx>=3.0", "infomap>=2.8"]

[project.urls]
Homepage = "https://www.mapequation.org"
Repository = "https://github.com/mapequation/networks"
Issues = "https://github.com/mapequation/networks/issues"

[project.scripts]
networks = "networks.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/networks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/networks"]

[tool.hatch.build.targets.sdist]
include = ["src/networks", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test requires internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["networks"]
strict = true

# Optional extras used only behind lazy imports in Network.to_*().
[[tool.mypy.overrides]]
module = ["networkx.*", "infomap.*"]
ignore_missing_imports = true
