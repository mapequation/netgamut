name: Refresh catalogs

# The bundled catalogs are snapshots of snap.stanford.edu and
# networks.skewed.de. This rebuilds both monthly and opens a pull request when
# either collection has changed, so new datasets reach users without anyone
# remembering to look.
on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the first of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --group dev

      # Each script exits non-zero if its result looks implausible, so an
      # upstream redesign fails this job instead of committing an empty catalog.
      - name: Rebuild the SNAP catalog
        run: uv run python scripts/regenerate_catalog.py

      - name: Rebuild the Netzschleuder catalog
        run: uv run python scripts/regenerate_netzschleuder_catalog.py

      - name: Test against the rebuilt catalog
        run: uv run pytest -m "not network"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-catalogs
          title: "chore: refresh the vendored catalogs"
          commit-message: "chore: refresh the vendored catalogs"
          delete-branch: true
          body: |
            Automated refresh of both vendored catalogs, from
            https://snap.stanford.edu/data/index.html and
            https://networks.skewed.de/api.

            The diff shows what changed in the collection: new datasets,
            withdrawn ones, updated statistics or download links.

            Review the diff before merging — an unexpectedly large change
            usually means one of the upstream sites altered its structure.
